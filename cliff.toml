[changelog]
header = """
# Change Log
"""

body = """
{% if version %}
### {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}
### Unreleased
{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}:

{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first | trim }}\
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/AndyTheFactory/newspaper4k/commit/{{ commit.id }}))\
{% if commit.author.name %} (by {{ commit.author.name }}){% endif %}
{% endfor %}
{% endfor %}
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v?[0-9]+\\.[0-9]+\\.[0-9]+.*"
sort_commits = "oldest"

commit_parsers = [
    # Features and related additions
    { message = "^feat", group = "New feature" },
    { message = "^feature", group = "New feature" },
    { message = "^lang", group = "New feature" },
    { message = "^parse", group = "New feature" },
    { message = "^docs?", group = "New feature" },
    { message = "^tests?", group = "New feature" },
    { message = "^rework", group = "New feature" },

    # Bug fixes
    { message = "^fix", group = "Bugs fixed" },
    { message = "^bug", group = "Bugs fixed" },

    # Maintenance categories
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^chore", group = "Maintenance" },
    { message = "^ci", group = "Continuous integration" },
    { message = "^build", group = "Build system" },
    { message = "^style", group = "Code style" },

    # Everything else
    { message = ".*", group = "Other changes" },
]

[remote.github]
owner = "AndyTheFactory"
repo = "newspaper4k"
